# Blueprint for https://dashboard.render.com — free Web Service
# Leon signs in → New → Blueprint → connect this repo (or paste dir)
services:
  - type: web
    name: lurkmoar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT -w 2 app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
